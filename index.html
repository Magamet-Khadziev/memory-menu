<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MEMORY | Меню кафе</title>
    
    <!-- Подключаем шрифты из Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <!-- Подключаем CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Подключение PWA -->
<!-- <link rel="manifest" href="manifest.json"> -->
<meta name="theme-color" content="#C69B6D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
</head>
<body>
    <!-- Основной контейнер приложения -->
    <div id="app">
        <!-- Здесь будет весь контент -->
    </div>

    <!-- Подключаем данные категорий -->
    <script src="js/data/breakfasts.js"></script>
    <script src="js/data/coffee.js"></script>
    <script src="js/data/teas.js"></script>
    <script src="js/data/lemonades.js"></script>
    <script src="js/data/cocktails.js"></script>
    <script src="js/data/main.js"></script>
    <script src="js/data/additional.js"></script>
    <script src="js/data/desserts.js"></script>
    
    <!-- Подключаем JavaScript -->
    <script src="js/renderer.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/app.js"></script>
    <!-- Регистрация Service Worker -->
<!-- Регистрация Service Worker (отключено для локальной разработки) -->
<script>
    // Проверяем, что мы не на file://
    if (window.location.protocol !== 'file:' && 'serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('sw.js')
                .then(function(registration) {
                    console.log('Service Worker зарегистрирован:', registration);
                })
                .catch(function(error) {
                    console.log('Ошибка регистрации Service Worker:', error);
                });
        });
    } else {
        console.log('ℹ️ Service Worker отключен для локальной разработки');
        console.log('📱 Для установки на планшет, загрузите проект на хостинг');
    }
</script>
</body>
</html>
